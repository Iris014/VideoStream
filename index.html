<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoStream</title>

    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <img src="static/images/VideoStream.png" alt="VideoStream">
        <nav class="nav">
            <a href="#inicio">Inicio</a>
            <a href="#explorar">Explorar</a>
            <a href="#milista">Mi lista</a>
        </nav>
        <div class="buscador">
            <input type="text" id="buscar" placeholder="">
            <button id="btnBuscar">
                <img src="static/icons/icon-2.png" alt="" class="img-buscar">
            </button>
        </div>
        <div class="campana">
            <img src="static/icons/icon-3.png" alt="" class="img-campana">
        </div>
        <div class="cuenta">
            <img src="static/icons/icon-4.png" alt="" class="img-cuenta">
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section class="c-interfaz">
            <div class="col-interfaz">
                <div class="c-video-player-1">
                    <div class="c-video">
                        <video src="static/" controls></video>
                    </div>
                    <div class="c-video-info">
                        <strong class="strong-video">
                            Lagos y montañas
                        </strong>
                        <p class="video-info">
                            95 mil visualizaciones 10 abr 2024
                        </p>
                    </div>
                </div>
                <div class="c-video-player-2">
                    <div class="c-likes">
                        <div class="c-like">
                            <img src="static/icons/icon-7.png" alt="Like" class="img-like">
                            <p class="like">
                                Like
                            </p>
                        </div>
                        <div class="c-dislike">
                            <img src="static/icons/icon-9.png" alt="Dislike" class="img-dislike">
                            <p class="dislike">
                                Dislike
                            </p>
                        </div>
                    </div>
                    <div class="c-compartir">
                            <img src="static/icons/icon-7.png" alt="Compartir" class="img-compartir">
                            <p class="compartir">
                                Compartir
                            </p>
                    </div>
                </div>
                <div class="c-video-player-3"></div>
            </div>
            <div class="col-interfaz"></div>
        </section>
    </main>
    <script src="static/js/script.js"></script>

</body>

</html>
